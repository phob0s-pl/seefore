name: Orders by post
prompt: The clerk takes orders that come by post, and types them into the shop.
given:
  - A posted order is placed as an order made online is.
add:
  connections/connection-clerk-orders:
    from: person-clerk
    to: app-order-api
    name: Types in a posted order
  flows/flow-taking-a-posted-order:
    name: Taking a posted order
    starts: An order comes by post
    ends: The order is kept in the store of orders
    feature: feature-ordering
    steps:
      - id: types-in
        does: connection-clerk-orders
        data: [data-order-details]
      - id: saves
        does: connection-api-writes-orders
        name: Saves the order
        data: [data-order-details]
update:
  features/feature-ordering:
    description: Customers buy things online or by post, and the clerk sees what they bought.
  apps/app-order-api:
    technology: null
  data/data-order-details:
    fields:
      - name: items
        description: What is bought, how many of each, and at what price
      - name: sent by
        description: Online or by post
  flows/flow-placing-an-order:
    starts: A customer places an order online
    steps:
      - places
      - id: types-in
        does: connection-clerk-orders
        only: when the order comes by post
        data: [data-order-details]
      - id: confirms
        reply: places
        name: Confirms the order by email
        only: when the customer gave an email address
remove:
  - technologies/tech-go
