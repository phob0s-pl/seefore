name: Placing an order
starts: A customer places an order in the shop
ends: The order is kept in the store of orders
feature: feature-ordering
steps:
  - id: places
    does: connection-customer-orders
    data: [data-order-details]
  - id: saves
    does: connection-api-writes-orders
    name: Saves the order
    only: when the customer has paid
    data: [data-order-details]
  - id: confirms
    reply: places
    name: Confirms the order
